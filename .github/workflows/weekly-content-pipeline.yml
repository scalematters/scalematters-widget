name: Weekly Content Pipeline

on:
  schedule:
    # Mondays 13:00 UTC (~9am ET) — adjust to taste
    - cron: '0 13 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Gather inputs (Salesforce, Gong, Drive)
        run: node gather-inputs.js
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
          GONG_ACCESS_KEY: ${{ secrets.GONG_ACCESS_KEY }}
          GONG_ACCESS_KEY_SECRET: ${{ secrets.GONG_ACCESS_KEY_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}
          DRIVE_CUSTOMER_FOLDER_ID: ${{ secrets.DRIVE_CUSTOMER_FOLDER_ID }}
          DRIVE_AGENCY_FOLDER_ID: ${{ secrets.DRIVE_AGENCY_FOLDER_ID }}

      - name: Refresh knowledge base (opens a PR)
        run: node refresh-knowledge-base.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Draft the Work Journal post
        run: node publish-work-journal.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_PRIVATE_APP_TOKEN: ${{ secrets.HUBSPOT_PRIVATE_APP_TOKEN }}
          HUBSPOT_BLOG_ID: ${{ secrets.HUBSPOT_BLOG_ID }}
